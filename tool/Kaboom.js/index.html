<script type="module">

// import kaboom.js
import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

// Initialize kaboom FIRST
kaboom()
setBackground(255, 234, 168)

const FLOOR_HEIGHT = 48
const JUMP_FORCE = 960
const SPEED = 500

// Load assets 
loadSprite("papa", "Sprites/papa.png")
loadSprite("bumpy", "Sprites/bumpy.png")

// Game Scene
scene("game", () => {
    setGravity(2400)

    // Add player inside the scene (renamed to "player" so all your functions match)
    const player = add([
        sprite("papa"),
        pos(80, 40),
        area(),
        body(),
    ])

    // Floor
    add([
        rect(width(), FLOOR_HEIGHT),
        outline(4),
        pos(0, height()),
        anchor("botleft"),
        area(),
        body({ isStatic: true }),
        color(0, 0, 0),
    ])

    function jump() {
        if (player.isGrounded()) {
            player.jump(JUMP_FORCE)
        }
    }

    onKeyPress("space", jump)
    onClick(jump)

    function spawnTree() {
        add([
			rect(48, rand(32, 96)),
            area(),
            outline(4),
            pos(width(), height() - FLOOR_HEIGHT),
            anchor("botleft"),
            color(59, 15, 217),
            move(LEFT, SPEED),
            "tree",
        ])

        // Wait a random amount of time to spawn next tree
        wait(rand(0.5, 1.5), spawnTree)
    }

    spawnTree()

    // adds my random sprite
    function spawnBumpy(){
        add([
            sprite("bumpy"),
            pos(rand(50, 60), rand(40, 90)),
            // Both objects must have area() component to enable collision detection between
            area(),
            "enemy",
        ])

        player.onCollide("enemy", (enemy) => {
        destroy(enemy)
        burp()
        })

        player.onCollideUpdate("enemy", () => {
        })
        
        wait(rand(0.5, 1.5), spawnBumpy)
    }
    spawnBumpy()

    // Collision
    player.onCollide("tree", () => {
        go("lose", score)
        burp()
        addKaboom(player.pos)
    })

    player.onCollideUpdate("enemy", () => {
    })


    // Score
    let score = 0
    const scoreLabel = add([
        text(score),
        pos(24, 24),
    ])

    onUpdate(() => {
        score++
        scoreLabel.text = score
    })
})

// Lose Scene
scene("lose", (score) => {
    add([
        sprite("papa"), // Changed from loadSprite() to sprite()
        pos(width() / 2, height() / 2 - 64),
        scale(2),
        anchor("center"),
    ])

    add([
        text(score),
        pos(width() / 2, height() / 2 + 64),
        scale(2),
        anchor("center"),
    ])

    onKeyPress("space", () => go("game"))
    onClick(() => go("game"))
})

// Start the game!
go("game")

</script>
