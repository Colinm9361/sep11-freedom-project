<script type="module">

// import kaboom.js
import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

// Initialize kaboom FIRST
kaboom()
setBackground(255, 234, 168)

const FLOOR_HEIGHT = 48
const JUMP_FORCE = 850
const SPEED = 480

// Load assets (make sure the path matches your actual folder/file name)
loadSprite("potato", "Sprites/poopoo1.png")

// Game Scene
scene("game", () => {
    setGravity(2400)

    // Add player inside the scene (renamed to "player" so all your functions match)
    const player = add([
        sprite("potato"),
        pos(80, 40),
        area(),
        body(),
    ])

    // Floor
    add([
        rect(width(), FLOOR_HEIGHT),
        outline(4),
        pos(0, height()),
        anchor("botleft"),
        area(),
        body({ isStatic: true }),
        color(0, 0, 0),
    ])

    function jump() {
        if (player.isGrounded()) {
            player.jump(JUMP_FORCE)
        }
    }

    onKeyPress("space", jump)
    onClick(jump)

    function spawnTree() {
        add([
            rect(48, rand(24, 64)),
            area(),
            outline(4),
            pos(width(), height() - FLOOR_HEIGHT),
            anchor("botleft"),
            color(59, 15, 217),
            move(LEFT, SPEED),
            "tree",
        ])

        // Wait a random amount of time to spawn next tree
        wait(rand(0.5, 1.5), spawnTree)
    }

    spawnTree()

    // Collision
    player.onCollide("tree", () => {
        go("lose", score)
        burp()
        addKaboom(player.pos)
    })

    // Score
    let score = 0
    const scoreLabel = add([
        text(score),
        pos(24, 24),
    ])

    onUpdate(() => {
        score++
        scoreLabel.text = score
    })
})

// Lose Scene
scene("lose", (score) => {
    add([
        sprite("potato"), // Changed from loadSprite() to sprite()
        pos(width() / 2, height() / 2 - 64),
        scale(2),
        anchor("center"),
    ])

    add([
        text(score),
        pos(width() / 2, height() / 2 + 64),
        scale(2),
        anchor("center"),
    ])

    onKeyPress("space", () => go("game"))
    onClick(() => go("game"))
})

// Start the game!
go("game")

</script>
